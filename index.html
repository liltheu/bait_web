<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d7e93">
<title>Bait</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bait">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=a5389b2d">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="top">
      <button class="pill loc hud hl" data-act="map"><b id="locName">Rio Sereno</b></button>
      <div class="tr">
        <div class="pill small hud hh" data-act="clock"><span id="clockIc"></span><b id="clock">10:24</b></div>
        <div class="pill money hud hm"><b id="coins">0</b><button class="plus" data-act="adcoins"><img src="art/hud/mais.webp" alt="+"></button></div>
        <div class="pill small hud hg"><b id="gems">0</b><button class="plus" data-act="shopgems"><img src="art/hud/mais.webp" alt="+"></button></div>
      </div>
    </div>
    <div class="side left">
      <button class="ib" data-act="map"><i class="art"><img src="art/ui/mapa.webp" alt="" data-b="art/ui/mapa"><b class="nb" id="nb-map"></b></i><em>MAPA</em></button>
      <button class="ib" data-act="missions"><i class="art"><img src="art/ui/missoes.webp" alt="" data-b="art/ui/missoes"><b class="nb" id="nb-missions"></b></i><em>MISSÕES</em></button>
    </div>
    <div class="side right">
      <button class="ib" data-act="bag"><i class="art"><img src="art/ui/mochila.webp" alt="" data-b="art/ui/mochila"><b class="nb" id="nb-bag"></b></i><em>MOCHILA</em></button>
      <button class="ib" data-act="rod"><i class="art"><img src="art/ui/vara.webp" alt="" data-b="art/ui/vara"><b class="nb" id="nb-rod"></b></i><em>VARA</em></button>
    </div>
    <button id="npc" data-act="npc"><i id="npcFace" class="art"><img src="art/npc/tiao_icone.webp" alt=""><b class="nb" id="nb-npc"></b></i><em id="npcName">Vô Tião</em></button>
    <button id="eyeBtn" data-act="hud" aria-label="Esconder botões"><svg viewBox="0 0 24 24" fill="none" stroke="#5a2d0e" stroke-width="1.7" stroke-linecap="round"><g class="op"><path d="M3 12C7 5 17 5 21 12C17 19 7 19 3 12Z" fill="#fff"/><circle cx="12" cy="12" r="3.6" fill="#5a2d0e" stroke="none"/><circle cx="13.3" cy="10.7" r="1.1" fill="#fff" stroke="none"/><path d="M12 6.6V3.6M8 7.3L7 4.7M16 7.3L17 4.7M5 9.1L3.4 7.2M19 9.1L20.6 7.2"/></g><g class="cl"><path d="M3 11C7 17 17 17 21 11"/><path d="M12 15.5V18.6M8 14.8L7 17.4M16 14.8L17 17.4M5 13.2L3.4 15.1M19 13.2L20.6 15.1"/></g></svg></button>
    <button id="admBtn" class="hud" data-act="admpanel">ADM</button>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="talk" data-act="dialog">
      <img id="tChar" alt="">
      <div id="tBub"><b id="tName"></b><p id="tText"></p></div>
      <button id="tNext" data-act="dialog">▶</button>
    </div>
    <div id="dialog" data-act="dialog">
      <div class="face" id="dFace">👴</div>
      <div class="dtext"><b id="dName">Vô Tião</b><p id="dText"></p><small>toque para continuar ▸</small></div>
    </div>
    <div id="catch">
      <div class="cRays"></div>
      <div class="cBox">
        <div class="cFish"><img class="cSplash" src="art/pesca/splash.webp" alt=""><div id="cFishImg"></div><b id="cNew">NOVO!</b><b id="cGem"></b></div>
        <div class="cRib"><img src="art/pesca/faixa.webp" alt=""><svg viewBox="0 0 720 232"><path id="cArc" d="M40,138 A760,760 0 0 1 680,138" fill="none"/><text id="cName" text-anchor="middle" dominant-baseline="central"><textPath href="#cArc" startOffset="50%"></textPath></text></svg></div>
        <div class="cRar"><img id="cRarImg" alt=""><b id="cRar"></b></div>
        <div class="cInfo"><img src="art/pesca/info.webp" alt=""><b id="cSize"></b><b id="cVal"></b></div>
        <div class="cBtns"><button data-act="sell"><img src="art/pesca/vender.webp" alt="Vender"></button><button class="cX2" data-act="double" id="cAd">📺<b>x2</b></button><button data-act="keep"><img src="art/pesca/guardar.webp" alt="Guardar"></button></div>
      </div>
    </div>
    <div id="bag">
      <div class="bq"><div class="bqf"></div>
        <div class="bqh"><img class="bqi" id="bqIcon" alt=""><h2 id="bqTitle">Mochila</h2>
          <button class="bqback" data-act="bagback" id="bqBack"><span>‹</span><b id="bqBackTxt">Coleção</b></button>
          <button class="bqx" data-act="bagclose"><img src="art/bag/fechar.webp" alt="Fechar"></button></div>
        <div class="bqb" id="bqBody"></div>
      </div>
    </div>
    <div id="rods">
      <div class="rhd"><button class="rback" data-act="rodsclose"><img src="art/varas/ui/voltar.webp" alt="Voltar"></button>
        <button class="radmin" data-act="rodadmin" title="Admin: liberar tudo">ADM</button></div>
      <div class="rscroll" id="rBody"></div>
    </div>
    <div id="modal">
      <div class="panel">
        <div class="ph"><h2 id="mTitle"></h2><button class="x" data-act="close">✕</button></div>
        <div class="pb" id="mBody"></div>
      </div>
    </div>
    <div id="ad"><div class="adbox"><b>ANÚNCIO</b><p>(simulação, o AdMob entra aqui depois)</p><div class="adc" id="adCount">3</div></div></div>
  </div>
</div>
<script src="game.js?v=a5389b2d"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') { const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()); navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); }); }</script>
</body>
</html>
